<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Tariff Intelligence | Agile vs FreePhase</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
            --purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            line-height: 1.5;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }

        h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .last-updated { font-size: 0.85rem; color: var(--text-muted); }

        .controls {
            background: var(--card-bg);
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        label { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            flex-grow: 1;
            max-width: 400px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .card-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
        .card-value { font-size: 1.75rem; font-weight: 700; }
        .card-sub { font-size: 0.8rem; color: var(--text-muted); }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--green); }
        .badge-amber { background: rgba(245, 158, 11, 0.2); color: var(--amber); }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        .badge-free { background: var(--purple); color: #fff; font-weight: 700; animation: pulse 2s infinite; }

        .price-free { color: var(--purple); font-weight: 700; }
        .price-negative { color: var(--green); font-weight: 700; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ GB Tariff Intelligence</h1>
        <div class="last-updated" id="lastUpdated">Loading...</div>
    </header>

    <div class="controls">
        <label for="dnoSelect">DNO Region:</label>
        <select id="dnoSelect" onchange="updateDashboard()">
            <option value="">Loading regions...</option>
        </select>
    </div>

    <div class="cards-grid">
        <div class="card">
            <span class="card-label">Carbon Intensity</span>
            <span class="card-value" id="carbonVal">--</span>
            <span class="card-sub">gCO₂ / kWh</span>
        </div>
        <div class="card">
            <span class="card-label">Current Agile Rate</span>
            <span class="card-value" id="agileVal">--</span>
            <span class="card-sub">p / kWh</span>
        </div>
        <div class="card">
            <span class="card-label">Current EDF FreePhase</span>
            <span class="card-value" id="edfVal">--</span>
            <span class="card-sub">p / kWh</span>
        </div>
        <div class="card">
            <span class="card-label">Next Free Window</span>
            <span class="card-value" id="freeSlotVal">--</span>
            <span class="card-sub" id="freeSlotSub">EDF Dynamic</span>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Band</th>
                    <th>Octopus Agile</th>
                    <th>EDF FreePhase</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="timelineBody">
                <tr><td colspan="5" style="text-align:center; padding: 2rem;">Loading timeline data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let gridData = null;

    async function loadData() {
        try {
            const res = await fetch('data/grid_status.json');
            gridData = await res.json();
            
            // Populate Header & Carbon
            document.getElementById('lastUpdated').innerText = `Updated: ${new Date(gridData.last_updated).toLocaleString()}`;
            document.getElementById('carbonVal').innerText = gridData.carbon_intensity || '0';

            // Populate DNO Dropdown
            const select = document.getElementById('dnoSelect');
            select.innerHTML = '';
            for (const [key, region] of Object.entries(gridData.dno_regions)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = region.name;
                select.appendChild(opt);
            }

            // Restore saved preference or default to first
            const savedRegion = localStorage.getItem('selected_dno');
            if (savedRegion && gridData.dno_regions[savedRegion]) {
                select.value = savedRegion;
            }

            updateDashboard();
        } catch (e) {
            console.error("Error loading JSON:", e);
            document.getElementById('lastUpdated').innerText = "Failed to load data";
        }
    }

    function updateDashboard() {
        if (!gridData) return;
        
        const regionKey = document.getElementById('dnoSelect').value;
        localStorage.setItem('selected_dno', regionKey);

        const timeline = gridData.half_hourly_timeline || [];
        if (timeline.length === 0) return;

        // Current Slot (Slot 0)
        const currentSlot = timeline[0];
        const currentPricing = currentSlot.regional_pricing[regionKey] || {};

        const currentAgile = currentPricing.agile_price !== null ? currentPricing.agile_price.toFixed(2) : '--';
        const currentEdf = currentPricing.edf_price !== null ? currentPricing.edf_price.toFixed(2) : '--';

        document.getElementById('agileVal').innerText = `${currentAgile}`;
        document.getElementById('edfVal').innerText = `${currentEdf}`;

        // Find Next Free Slot
        let nextFreeTime = null;
        for (const slot of timeline) {
            const p = slot.regional_pricing[regionKey];
            if (p && p.is_free_moment) {
                nextFreeTime = slot.display_time;
                break;
            }
        }

        if (currentPricing.is_free_moment) {
            document.getElementById('freeSlotVal').innerText = "FREE NOW";
            document.getElementById('freeSlotVal').style.color = "var(--purple)";
        } else if (nextFreeTime) {
            document.getElementById('freeSlotVal').innerText = nextFreeTime;
            document.getElementById('freeSlotVal').style.color = "var(--text)";
        } else {
            document.getElementById('freeSlotVal').innerText = "None Scheduled";
            document.getElementById('freeSlotVal').style.color = "var(--text-muted)";
        }

        // Build Table
        const tbody = document.getElementById('timelineBody');
        tbody.innerHTML = '';

        timeline.forEach(slot => {
            const pricing = slot.regional_pricing[regionKey] || {};
            const agile = pricing.agile_price;
            const edf = pricing.edf_price;
            const isFree = pricing.is_free_moment;

            const tr = document.createElement('tr');

            // Time Column
            const tdTime = document.createElement('td');
            tdTime.innerText = slot.display_time;

            // Band Column
            const tdBand = document.createElement('td');
            let badgeClass = 'badge-amber';
            if (slot.band_code === 'GREEN') badgeClass = 'badge-green';
            if (slot.band_code === 'RED') badgeClass = 'badge-red';
            tdBand.innerHTML = `<span class="badge ${badgeClass}">${slot.band_name}</span>`;

            // Agile Column
            const tdAgile = document.createElement('td');
            if (agile !== null && agile !== undefined) {
                tdAgile.innerText = `${agile.toFixed(2)} p`;
                if (agile < 0) tdAgile.className = 'price-negative';
            } else {
                tdAgile.innerText = '--';
            }

            // EDF Column
            const tdEdf = document.createElement('td');
            if (edf !== null && edf !== undefined) {
                tdEdf.innerText = `${edf.toFixed(2)} p`;
                if (isFree) tdEdf.className = 'price-free';
            } else {
                tdEdf.innerText = '--';
            }

            // Status Column
            const tdStatus = document.createElement('td');
            if (isFree) {
                tdStatus.innerHTML = `<span class="badge badge-free">FREE MOMENT</span>`;
            } else if (agile !== null && agile < 0) {
                tdStatus.innerHTML = `<span class="badge badge-green">PLUNGE PRICING</span>`;
            } else {
                tdStatus.innerText = '-';
            }

            tr.appendChild(tdTime);
            tr.appendChild(tdBand);
            tr.appendChild(tdAgile);
            tr.appendChild(tdEdf);
            tr.appendChild(tdStatus);

            tbody.appendChild(tr);
        });
    }

    loadData();
</script>

</body>
</html>
