<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GB Grid & Smart Tariff Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --border: #232d45;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }
    h1 { font-size: 1.8rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    
    .region-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    select {
      background: #0b0f19;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .metric-label { font-size: 0.78rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .metric-val { font-size: 1.8rem; font-weight: 800; margin-top: 6px; color: var(--green); }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .chart-card h2 { margin-top: 0; font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
    .chart-container { position: relative; height: 340px; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <h1>🇬🇧 GB Grid & Tariff Intelligence</h1>
        <div style="font-size:0.85rem; color: var(--muted);" id="updated-text">Connecting...</div>
      </div>
      <div class="region-select-wrap">
        <label style="font-size:0.85rem; color:var(--muted); font-weight:600;">DNO Region:</label>
        <select id="region-selector" onchange="updateDashboard()"></select>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">National Grid Demand</div>
        <div class="metric-val" id="val-demand">-- MW</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Renewable Share</div>
        <div class="metric-val" id="val-renewable">-- %</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Carbon Intensity</div>
        <div class="metric-val" style="color: var(--blue);" id="val-carbon">-- gCO₂</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Current Agile Rate</div>
        <div class="metric-val" style="color: var(--amber);" id="val-agile">-- p</div>
      </div>
    </div>

    <!-- TARIFF GRAPH -->
    <div class="chart-card">
      <h2>⚡ Half-Hourly Tariff Forecast: Octopus Agile vs. EDF FreePhase</h2>
      <div class="chart-container">
        <canvas id="tariffChart"></canvas>
      </div>
    </div>

    <!-- GENERATION GRAPH -->
    <div class="chart-card">
      <h2>📊 Live National Power Generation Breakdown (MW)</h2>
      <div class="chart-container">
        <canvas id="gridChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let globalData = null;
    let tariffChartInstance = null;
    let gridChartInstance = null;

    async function init() {
      try {
        const res = await fetch('./data/grid_status.json?t=' + Date.now());
        globalData = await res.json();

        // Populate Region Dropdown
        const sel = document.getElementById('region-selector');
        sel.innerHTML = '';
        Object.entries(globalData.dno_regions).forEach(([code, reg]) => {
          const opt = document.createElement('option');
          opt.value = code;
          opt.innerText = reg.name;
          if (code === '_A') opt.selected = true;
          sel.appendChild(opt);
        });

        document.getElementById('updated-text').innerText = `Updated: ${new Date(globalData.last_updated).toLocaleString('en-GB')}`;
        
        // Render Static Grid Stats
        const grid = globalData.live_grid;
        document.getElementById('val-demand').innerText = grid.total_mw > 0 ? `${grid.total_mw.toLocaleString()} MW` : '-- MW';
        document.getElementById('val-renewable').innerText = `${grid.renewable_pct}%`;
        document.getElementById('val-carbon').innerText = `${globalData.carbon_intensity} g`;

        renderGridChart(grid.fuel_breakdown);
        updateDashboard();
      } catch (err) {
        console.error("Failed to load dashboard data:", err);
      }
    }

    function updateDashboard() {
      if (!globalData) return;
      const regionCode = document.getElementById('region-selector').value;
      const timeline = globalData.half_hourly_timeline;

      const labels = timeline.map(t => t.display_time);
      const agilePrices = timeline.map(t => t.regional_pricing[regionCode].agile_price);
      const edfPrices = timeline.map(t => t.regional_pricing[regionCode].edf_price);

      // Current rate metric
      document.getElementById('val-agile').innerText = `${agilePrices[0]} p/kWh`;

      // Draw/Update Tariff Comparison Chart
      if (tariffChartInstance) tariffChartInstance.destroy();

      const ctx = document.getElementById('tariffChart').getContext('2d');
      tariffChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Octopus Agile (Half-Hourly Dynamic)',
              data: agilePrices,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              borderWidth: 2,
              stepped: true,
              fill: true
            },
            {
              label: 'EDF FreePhase (Daily Banded)',
              data: edfPrices,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.05)',
              borderWidth: 3,
              stepped: true,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#f8fafc' } } },
          scales: {
            y: {
              title: { display: true, text: 'Unit Rate (p/kWh)', color: '#94a3b8' },
              ticks: { color: '#94a3b8' },
              grid: { color: '#232d45' }
            },
            x: {
              ticks: { color: '#94a3b8', maxTicksLimit: 16 },
              grid: { display: false }
            }
          }
        }
      });
    }

    function renderGridChart(breakdown) {
      if (!breakdown) return;
      if (gridChartInstance) gridChartInstance.destroy();

      const labels = Object.keys(breakdown);
      const values = Object.values(breakdown);

      const ctx = document.getElementById('gridChart').getContext('2d');
      gridChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Generation (MW)',
            data: values,
            backgroundColor: labels.map(l => {
              if (['Wind', 'Solar', 'Hydro', 'Biomass'].includes(l)) return '#10b981';
              if (['Nuclear'].includes(l)) return '#a855f7';
              if (['Gas (CCGT)', 'Coal', 'Oil'].includes(l)) return '#f97316';
              return '#38bdf8';
            })
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#232d45' } },
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
          }
        }
      });
    }

    init();
  </script>
</body>
</html>
