name: Retrain models

# Weekly, not daily -- LightGBM on ~30 months of history is comparatively
# heavy and the underlying demand/price patterns don't shift fast enough to
# need daily retraining. The twice-daily refresh.yml workflow's rolling
# conformal recalibration (see predict.py) is what actually tracks
# short-term volatility; this just keeps the base models current.
on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC
  workflow_dispatch: {}   # manual trigger from the Actions tab when needed

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests lightgbm scikit-learn joblib --break-system-packages

      - name: Build training matrix
        run: python3 build_training_matrix.py

      - name: Train models
        run: python3 train_model.py

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_agile.joblib model_freephase.joblib
          git diff --staged --quiet && echo "No model changes to commit" && exit 0
          git commit -m "Retrain models [automated]"
          git push
